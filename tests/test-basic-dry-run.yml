name: Test basic dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: cbrgm/cleanup-stale-branches-action
          dry-run: 'true'
          last-commit-age-days: '30'
          rate-limit: 'true'
      - name: Assert action completed successfully
        run: |
          echo "Action completed in dry-run mode without errors"
          echo "PASS"
