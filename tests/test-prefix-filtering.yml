name: Test prefix filtering inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run cleanup action with prefix filtering
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          repository: 'cbrgm/cleanup-stale-branches-action'
          allowed-prefixes: 'feature/,fix/,chore/'
          ignored-prefixes: 'release/,hotfix/'
          dry-run: 'true'
          last-commit-age-days: '60'
      - name: Assert action completed successfully
        run: |
          echo "Action completed with allowed-prefixes and ignored-prefixes configured"
          echo "PASS"
