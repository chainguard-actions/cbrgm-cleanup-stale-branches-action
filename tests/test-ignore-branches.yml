name: Test ignore-branches input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run cleanup action with ignore-branches
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          repository: 'cbrgm/cleanup-stale-branches-action'
          ignore-branches: 'main,develop,master'
          dry-run: 'true'
          last-commit-age-days: '30'
      - name: Assert action completed successfully
        run: |
          echo "Action completed with ignore-branches set to main,develop,master"
          echo "PASS"
