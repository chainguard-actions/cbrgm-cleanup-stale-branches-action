name: Test ignore-branches filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          dry-run: 'true'
          last-commit-age-days: '30'
          ignore-branches: 'main,master,develop'
      - name: Assert action ran with ignore-branches filter
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with ignore-branches=main,master,develop in dry-run mode (outcome=$OUTCOME)"
