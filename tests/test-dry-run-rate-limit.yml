name: Test dry-run with rate-limit enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run cleanup action with rate-limit enabled in dry-run mode
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          repository: actions/checkout
          dry-run: 'true'
          last-commit-age-days: '365'
          rate-limit: 'true'
          ignore-branches: 'main,master'
      - name: Assert action completed successfully
        run: |
          echo "Action completed with rate-limit enabled without error"
          echo "PASS"
