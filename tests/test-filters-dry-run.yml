name: Test dry run with branch filters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN || github.token }}
          repository: cbrgm/cleanup-stale-branches-action
          ignore-branches: main,master,develop
          allowed-prefixes: feature/,renovate/,dependabot/
          ignored-prefixes: release/
          last-commit-age-days: '7'
          dry-run: 'true'
          rate-limit: 'false'
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected filtered dry run to succeed"
            exit 1
          fi
          echo "PASS"
