name: Test with ignored prefixes only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: cbrgm/cleanup-stale-branches-action
          dry-run: 'true'
          last-commit-age-days: '365'
          ignore-branches: 'main,master'
          ignored-prefixes: 'release/,hotfix/,stable/'
          rate-limit: 'true'
      - name: Assert action completed successfully with ignored prefixes
        run: |
          echo "Action completed with ignored-prefixes filter in dry-run mode without errors"
          echo "PASS"
