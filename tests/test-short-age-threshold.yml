name: Test short commit age threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: actions/checkout
          dry-run: 'true'
          last-commit-age-days: '1'
          ignore-branches: 'main,master'
          rate-limit: 'false'

      - name: Assert action completed with short age threshold
        run: |
          echo "Action completed successfully with 1-day age threshold in dry-run mode"
          echo "PASS"
