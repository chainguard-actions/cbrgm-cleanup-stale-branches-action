name: Test high last-commit-age-days threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          dry-run: 'true'
          last-commit-age-days: '9999'
      - name: Assert action ran with high age threshold
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with last-commit-age-days=9999 in dry-run mode (outcome=$OUTCOME)"
          echo "No branches should be considered stale with such a high threshold"
