name: Test branch filtering options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: actions/checkout
          dry-run: 'true'
          last-commit-age-days: '365'
          ignore-branches: 'main,master,develop'
          allowed-prefixes: 'feature/,fix/,chore/'
          ignored-prefixes: 'release/'
          rate-limit: 'false'

      - name: Assert action completed with filters applied
        run: |
          echo "Action completed successfully with branch filters in dry-run mode"
          echo "PASS"
